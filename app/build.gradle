plugins { id 'com.android.application' }
dependencies {
    implementation files('../third_party/java/snakeyaml-2.6.jar')
    testImplementation 'junit:junit:4.13.2'
}

def verifyJavaDependencies = tasks.register('verifyJavaDependencies', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/android.py', 'dependencies', 'check'
    inputs.dir rootProject.file('third_party/java')
}

def nativeLock = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/rtp2httpd.lock.json'))
def abiSelection = providers.gradleProperty('abi').orElse(providers.environmentVariable('RTP2HTTPD_ABI')).getOrElse('universal')
if (abiSelection != 'universal' && !nativeLock.abis.contains(abiSelection)) {
    throw new GradleException('Unsupported ABI: ' + abiSelection)
}
def targetAbis = abiSelection == 'universal' ? nativeLock.abis : [abiSelection]
def nativeOutput = layout.buildDirectory.dir('generated/native-core')
def buildNativeCore = tasks.register('buildNativeCore', Exec) {
    group = 'build'
    description = 'Fetch pinned rtp2httpd sources and build the selected Android ARM executables'
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/android.py', 'native',
        '--sdk-root', android.sdkDirectory.absolutePath, '--abi', abiSelection
    inputs.file rootProject.file('third_party/rtp2httpd.lock.json')
    inputs.dir rootProject.file('third_party/java')
    inputs.dir rootProject.file('native')
    inputs.files(rootProject.fileTree('scripts') { include '**/*.py', '**/*.cjs' })
    inputs.dir rootProject.file('app/src')
    inputs.dir rootProject.file('artwork')
    inputs.dir rootProject.file('docs')
    inputs.dir rootProject.file('gradle')
    inputs.property 'localSource', providers.environmentVariable('RTP2HTTPD_SOURCE_DIR').orElse('')
    inputs.property 'abis', targetAbis
    inputs.files rootProject.file('app/build.gradle'), rootProject.file('build.gradle'),
        rootProject.file('settings.gradle'), rootProject.file('gradle.properties'), rootProject.file('README.md')
    outputs.dir nativeOutput
    outputs.dir rootProject.layout.buildDirectory.dir('outputs/native')
}

android {
    ndkVersion nativeLock.ndk_version
    def discoveredNdk = providers.exec {
        workingDir rootProject.projectDir
        commandLine 'python3', 'scripts/android.py', 'locate', 'ndk',
            '--sdk-root', android.sdkDirectory.absolutePath
    }.standardOutput.asText.get().trim()
    if (file(discoveredNdk + '/source.properties').isFile()) ndkPath discoveredNdk
    namespace 'local.rtp2httpd'
    compileSdk 34
    defaultConfig {
        applicationId 'local.rtp2httpd'
        minSdk 26
        targetSdk 34
        versionCode 3017002
        versionName '3.17.2'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include(*targetAbis)
            universalApk true
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // The script already strips the executable; preserve bytes for hash verification.
            keepDebugSymbols += ['**/librtp2httpd.so']
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = [nativeOutput.map { it.dir('jniLibs') }]
            assets.srcDir(nativeOutput.map { it.dir('assets') })
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.name == 'release') {
        variant.outputs.all { output ->
            if (output.getFilter('ABI') == null) outputFileName = 'app-release-unsigned.apk'
        }
    }
}

def verifyReleaseCore = tasks.register('verifyReleaseCore') {
    group = 'verification'
    description = 'Check the Release APK contains the pinned Android executable and license'
    dependsOn 'packageRelease'
    doLast {
        android.applicationVariants.find { it.name == 'release' }.outputs.each { output ->
            project.exec {
                workingDir rootProject.projectDir
                commandLine 'python3', 'scripts/android.py', 'verify', output.outputFile.absolutePath,
                    '--abi', output.getFilter('ABI') ?: abiSelection
            }
        }
    }
}

tasks.configureEach {
    if (name.matches('compile.*JavaWithJavac')) dependsOn verifyJavaDependencies
    if (name.matches('merge.*(JniLibFolders|Assets)')) dependsOn buildNativeCore
    if (name == 'assembleRelease') dependsOn verifyReleaseCore
}
