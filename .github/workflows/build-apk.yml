name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标架构（universal 同时生成通用包和两个独立包）'
        type: choice
        default: universal
        options:
          - universal
          - armeabi-v7a
          - arm64-v8a
      sign:
        description: '使用仓库 Release Secrets 签名'
        type: boolean
        default: false
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_ABI: ${{ inputs.abi || 'universal' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare CI SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify build scripts
        run: python3 scripts/android.py test --python-only
      - name: Build selected packages
        run: python3 scripts/android.py build --backend sdk --abi "$TARGET_ABI"
      - name: Collect packages and corresponding source
        run: |
          mkdir -p build/download
          cp app/build/outputs/apk/release/*-unsigned.apk build/download/
          cp app/build/outputs/apk/release/output-metadata.json build/download/
          cp build/outputs/native/*-source.tar.gz build/download/
      - name: Sign packages
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo '::error::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS before requesting a signed build.'
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in build/download/*-unsigned.apk; do
            signed="${apk%-unsigned.apk}-signed.apk"
            "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --out "$signed" "$apk"
            "$signer" verify "$signed"
          done
      - name: Generate checksums
        working-directory: build/download
        run: sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.TARGET_ABI }}-${{ github.run_number }}
          path: build/download/
          if-no-files-found: error
          retention-days: 30
